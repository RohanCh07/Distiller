# Production-style setup: Postgres + two gateway replicas behind one port + optional vLLM.
#   cp distiller.example.yaml deploy/config/distiller.yaml
#   set  database: postgresql://distiller:distiller@postgres:5432/distiller
#   docker compose -f deploy/docker-compose.yml up --build
# Every replica shares task modes, API keys, logs and drift state through Postgres.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: distiller
      POSTGRES_PASSWORD: distiller
      POSTGRES_DB: distiller
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distiller"]
      interval: 5s
      retries: 10

  gateway:
    build: {context: .., dockerfile: deploy/Dockerfile}
    depends_on: {postgres: {condition: service_healthy}}
    deploy: {replicas: 2}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DISTILLER_ADMIN_KEY: ${DISTILLER_ADMIN_KEY}
      DISTILLER_ENCRYPTION_KEY: ${DISTILLER_ENCRYPTION_KEY}
      WORKERS: "2"
    volumes:
      - ./config:/config:ro
      - ../runs:/app/runs:ro
    expose: ["8000"]

  proxy:  # one public port in front of the replicas
    image: nginx:1.27
    depends_on: [gateway]
    ports: ["8000:8000"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]

  vllm:  # optional, needs an NVIDIA GPU: docker compose --profile gpu up
    profiles: [gpu]
    image: vllm/vllm-openai:latest
    command: ["--model", "/runs/transactions/merged", "--served-model-name", "transactions", "--port", "8001"]
    volumes: ["../runs:/runs:ro"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  pgdata:
